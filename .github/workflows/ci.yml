name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  checks: read
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The integration tests drive the relay against real Postgres databases:
  # `sqlx::test` creates one throwaway database per test from this URL.
  DATABASE_URL: postgres://keeplin:keeplin@localhost:5432/keeplin

jobs:
  test:
    name: Check, Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keeplin
          POSTGRES_PASSWORD: keeplin
          POSTGRES_DB: keeplin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keeplin -d keeplin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Prove pull-request token cannot rewrite check runs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs
        run: |
          get_status=$(curl --silent --show-error --output /tmp/check-runs-response --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${CHECKS_URL}")
          test "${get_status}" = 200
          check_id=$(jq -r '.check_runs[] | select(.name == "Check, Test & Lint") | .id' /tmp/check-runs-response | head -n1)
          test -n "${check_id}"
          status=$(curl --silent --output /tmp/check-patch-response --write-out '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${CHECKS_URL%/commits/*}/check-runs/${check_id}" \
            -d '{"output":{"title":"permission canary","summary":"must be forbidden"}}')
          test "${status}" = 403

      - name: Check pull-request review governance
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {
              DEBT_PATH,
              evaluateReviewGovernance,
            } = require('./.github/scripts/check-review-governance.js');

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
              response => response.data.map(file => file.filename),
            );
            const debtContent = fs.existsSync(DEBT_PATH)
              ? fs.readFileSync(DEBT_PATH, 'utf8')
              : '';
            const result = evaluateReviewGovernance({
              body: context.payload.pull_request.body || '',
              changedFiles,
              debtContent,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              pullNumber: context.issue.number,
            });

            core.info(result.message);
            if (!result.ok) core.setFailed(result.message);

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Contractual docs: every .rs has a companion .md and every companion
      # carries a `## Graph context` section (the two-layer navigation model).
      - name: Check companion docs
        run: ./scripts/check-docs.sh

      - name: Test companion tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (workspace)
        run: cargo fmt --check --all

      - name: cargo test (workspace)
        run: cargo test --workspace

      # --all-targets lints test and bench code too, matching the command the README
      # tells contributors to run locally. It also fully subsumes `cargo check`.
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Prebuilt binary instead of `cargo install cargo-audit` — compiling the tool
      # from source added minutes to every run for no additional coverage.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      # Runs last on purpose: a governance regression should not abort the job before
      # docs, cargo and audit have reported what else is green.
      - name: Test pull-request governance checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test \
            .github/scripts/check-review-governance.test.js \
            .github/scripts/check-review-loop.test.js

  graph:
    # This name is the branch-protection required-check identifier. Renaming it
    # makes protection wait forever for a check nobody reports, silently blocking
    # every PR with no red signal. Change it only together with the required-check
    # list in Settings -> Branches of both repositories.
    name: Knowledge graph up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so every CI artifact is generated with the same extractor version.
      - name: Install graphify
        run: python -m pip install --quiet "graphifyy==0.9.25"

      - name: Generate and validate knowledge graph
        env:
          GRAPHIFY_REQUIRED: "1"
        run: ./scripts/check-graph.sh

      - name: Publish knowledge graph
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
