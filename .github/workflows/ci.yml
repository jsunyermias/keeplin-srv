name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  # The review-loop convergence check reads the head commit's check runs to build the
  # set of red required checks. Without this it sees an empty set and would declare a
  # failing pull request converged.
  checks: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The integration tests drive the relay against real Postgres databases:
  # `sqlx::test` creates one throwaway database per test from this URL.
  DATABASE_URL: postgres://keeplin:keeplin@localhost:5432/keeplin

jobs:
  test:
    name: Check, Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keeplin
          POSTGRES_PASSWORD: keeplin
          POSTGRES_DB: keeplin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keeplin -d keeplin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Test pull-request governance checks
        run: |
          node --test \
            .github/scripts/check-review-governance.test.js \
            .github/scripts/check-review-loop.test.js

      - name: Check pull-request review governance
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {
              DEBT_PATH,
              evaluateReviewGovernance,
            } = require('./.github/scripts/check-review-governance.js');

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
              response => response.data.map(file => file.filename),
            );
            const debtContent = fs.existsSync(DEBT_PATH)
              ? fs.readFileSync(DEBT_PATH, 'utf8')
              : '';
            const result = evaluateReviewGovernance({
              body: context.payload.pull_request.body || '',
              changedFiles,
              debtContent,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              pullNumber: context.issue.number,
            });

            core.info(result.message);
            if (!result.ok) core.setFailed(result.message);

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Contractual docs: every .rs has a companion .md and every companion
      # carries a `## Graph context` section (the two-layer navigation model).
      - name: Check companion docs
        run: ./scripts/check-docs.sh

      - name: Test companion tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (workspace)
        run: cargo fmt --check --all

      - name: cargo test (workspace)
        run: cargo test --workspace

      # --all-targets lints test and bench code too, matching the command the README
      # tells contributors to run locally. It also fully subsumes `cargo check`.
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Prebuilt binary instead of `cargo install cargo-audit` — compiling the tool
      # from source added minutes to every run for no additional coverage.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  graph:
    # This name is the branch-protection required-check identifier. Renaming it
    # makes protection wait forever for a check nobody reports, silently blocking
    # every PR with no red signal. Change it only together with the required-check
    # list in Settings -> Branches of both repositories.
    name: Knowledge graph up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so every CI artifact is generated with the same extractor version.
      - name: Install graphify
        run: python -m pip install --quiet "graphifyy==0.9.25"

      - name: Generate and validate knowledge graph
        env:
          GRAPHIFY_REQUIRED: "1"
        run: ./scripts/check-graph.sh

      - name: Publish knowledge graph
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  converge:
    # This name is a branch-protection required-check identifier, like the graph job's.
    # Change it only together with the required-check list in Settings -> Branches.
    #
    # It is a separate job because convergence claims "the required checks are green",
    # and a step inside `test` cannot know its own job's outcome: it ran before cargo
    # test, clippy and audit, while `graph` was still going. `needs` makes that claim
    # checkable. `always()` keeps it reporting when a dependency fails, so protection
    # sees a red check rather than a skipped one.
    name: Review loop converged
    needs: [test, graph]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check review-loop convergence
        env:
          REVIEW_LOOP_STAGNATION_LIMIT: "3"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {
              DEFAULT_STAGNATION_LIMIT,
              STALLS_PATH,
              diffSignatureFromFiles,
              evaluateReviewLoop,
              pendingChecksFromRuns,
              redChecksFromRuns,
            } = require('./.github/scripts/check-review-loop.js');

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
              response => response.data.map(file => ({
                filename: file.filename,
                status: file.status,
                sha: file.sha,
              })),
            );
            const runs = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha,
                per_page: 100,
              },
              response => response.data.check_runs.map(run => ({
                name: run.name,
                status: run.status,
                conclusion: run.conclusion,
              })),
            );
            // Only this job is excluded, and only because it is the one still running.
            // The jobs it depends on have completed, so their real conclusions count.
            const self = ['Review loop converged'];
            const stallsContent = fs.existsSync(STALLS_PATH)
              ? fs.readFileSync(STALLS_PATH, 'utf8')
              : '';
            const result = evaluateReviewLoop({
              body: context.payload.pull_request.body || '',
              changedFiles: files.map(file => file.filename),
              stallsContent,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              pullNumber: context.issue.number,
              redChecks: redChecksFromRuns(runs, self),
              pendingChecks: pendingChecksFromRuns(runs, self),
              diffSignature: diffSignatureFromFiles(files),
              stagnationLimit:
                Number(process.env.REVIEW_LOOP_STAGNATION_LIMIT) || DEFAULT_STAGNATION_LIMIT,
            });

            core.info(`${result.state}: ${result.message}`);
            if (!result.ok) core.setFailed(result.message);
